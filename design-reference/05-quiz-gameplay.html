<!DOCTYPE html>

<body class="bg-surface text-on-surface font-body min-h-screen selection:bg-primary/30">
<!-- Top Navigation (Shell suppressed for focused task as per mandate) -->
<header class="w-full bg-[#10102c] sticky top-0 z-50">
<div class="max-w-[1440px] mx-auto flex justify-between items-center px-6 h-16">
<div class="flex items-center gap-4">
<span class="text-2xl font-bold tracking-tighter text-[#c49aff]">Quizap</span>
<div class="hidden md:flex items-center gap-2 px-3 py-1 bg-surface-container rounded-full">
<span class="text-xs font-bold font-headline text-secondary uppercase tracking-wider">Science</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span class="text-[10px] px-2 py-0.5 rounded bg-error-container/20 text-error font-bold">MEDIUM</span>
</div>
</div>

<svg class="w-full h-full -rotate-90">

<circle class="text-secondary timer-ring" cx="24" cy="24" fill="transparent" r="20" stroke="currentColor" stroke-linecap="round" stroke-width="3"></circle>
</svg>
<span class="absolute text-sm font-bold font-headline text-on-surface">0:25</span>
</div>
</div>
<div class="flex items-center gap-6">
<div class="flex items-center gap-2">

</div>
<div class="flex items-center gap-1.5 bg-tertiary-container/10 px-3 py-1.5 rounded-full border border-tertiary/20">

</div>

<h1 class="text-4xl md:text-5xl font-extrabold font-headline leading-tight tracking-tight text-transparent bg-clip-text bg-gradient-to-br from-on-surface to-on-surface-variant mb-4">
                5. What is the chemical symbol for gold?
            </h1>
<p class="text-on-surface-variant font-medium">Think carefully! This is a medium-tier question.</p>
</section>
<!-- Answer Grid -->
<div class="w-full max-w-2xl flex flex-col gap-4">
<!-- Option A -->
<button class="group w-full flex items-center p-5 rounded-lg bg-surface-container-low border border-transparent hover:bg-surface-container hover:-translate-y-1 transition-all duration-300 text-left">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center font-bold font-headline text-on-surface-variant group-hover:text-primary transition-colors">A</div>
<span class="ml-6 text-xl font-bold font-headline text-on-surface">Ag</span>
<div class="ml-auto opacity-0 group-hover:opacity-40">
<span class="material-symbols-outlined text-2xl" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</div>
</button>
<!-- Option B (Selected State) -->
<button class="w-full flex items-center p-5 rounded-lg bg-gradient-to-br from-primary to-primary-dim shadow-[0_10px_30px_rgba(148,70,249,0.3)] ring-2 ring-primary -translate-y-1 text-left relative overflow-hidden">

<!-- Option C -->

<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center font-bold font-headline text-on-surface-variant group-hover:text-primary transition-colors">C</div>
<span class="ml-6 text-xl font-bold font-headline text-on-surface">Gd</span>
<div class="ml-auto opacity-0 group-hover:opacity-40">
<span class="material-symbols-outlined text-2xl" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</div>
</button>
<!-- Option D -->
<button class="group w-full flex items-center p-5 rounded-lg bg-surface-container-low border border-transparent hover:bg-surface-container hover:-translate-y-1 transition-all duration-300 text-left">

<button class="flex items-center gap-2 px-6 py-3 rounded-full text-on-surface-variant font-bold hover:text-on-surface transition-colors group">
<span>Skip</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1" data-icon="double_arrow">double_arrow</span>
</button>

</main>
