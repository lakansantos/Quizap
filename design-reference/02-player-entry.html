<div class="flex items-center gap-4">

<div class="absolute top-1/4 left-10 text-primary-dim/20 animate-float" style="animation-delay: 0s;">
<span class="material-symbols-outlined text-8xl" data-icon="question_mark">question_mark</span>

<input class="w-full bg-surface-container-low border-0 rounded-DEFAULT px-6 py-5 text-xl font-medium focus:ring-2 focus:ring-primary/50 transition-all duration-300 placeholder:text-outline/50 text-on-surface group-hover:bg-surface-container" placeholder="Enter your name..." type="text"/>
<div class="absolute inset-0 rounded-DEFAULT pointer-events-none border border-primary/0 group-focus-within:border-primary/40 transition-all duration-300"></div>
</div>

<p class="text-label-sm font-bold tracking-widest uppercase text-on-surface-variant/80">Choose your Avatar</p>
<div class="grid grid-cols-3 md:grid-cols-6 gap-4">

<button class="relative aspect-square rounded-full flex items-center justify-center bg-tertiary-container ring-4 ring-tertiary transition-transform duration-200 active:scale-95 group">
<span class="material-symbols-outlined text-on-tertiary-container text-3xl" data-icon="pet_supplies" data-weight="fill" style="font-variation-settings: 'FILL' 1;">pet_supplies</span>
<div class="absolute -top-1 -right-1 bg-secondary text-on-secondary rounded-full p-0.5">

<span class="text-[11px] font-bold font-headline">Leagues</span>
