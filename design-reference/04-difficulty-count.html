</div>

<main class="pt-24 pb-32 px-6 max-w-[1440px] mx-auto min-h-screen">

<div class="max-w-3xl mx-auto mb-12">
<div class="flex justify-between items-end mb-4">
<div>
<h1 class="headline-font text-3xl font-extrabold text-on-surface tracking-tight">Game Settings</h1>
<div class="flex items-center gap-2 mt-2">

<div class="flex items-center gap-1.5 px-3 py-1 bg-surface-container rounded-full text-[10px] font-bold text-tertiary uppercase tracking-widest border border-tertiary/20">

<span>Science &amp; Space</span>
</div>
</div>
</div>
<span class="text-xs font-bold text-on-surface-variant">66% Complete</span>
</div>
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full w-2/3 gradient-primary rounded-full shadow-[0_0_15px_rgba(154,77,255,0.4)]"></div>
</div>
</div>
<div class="grid grid-cols-1 lg:grid-cols-12 gap-10 max-w-6xl mx-auto">

<div class="absolute top-0 right-0 p-4 opacity-0 group-hover:opacity-10 transition-opacity">
<span class="material-symbols-outlined text-8xl text-secondary">bolt</span>
</div>
<div class="w-16 h-16 rounded-full bg-secondary/10 flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-secondary text-4xl fill-icon">bolt</span>
</div>
<h3 class="headline-font text-xl font-bold text-on-surface mb-2">Easy</h3>
<p class="text-on-surface-variant text-sm text-center mb-6">For those just starting their stellar journey.</p>
<div class="mt-auto flex gap-1">
<span class="material-symbols-outlined text-secondary text-lg fill-icon">star</span>
<span class="text-xs font-bold text-secondary">50 XP Per Win</span>
</div>
</button>

</div>
<div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center mb-6 ring-4 ring-primary/5">
<div class="flex">
<span class="material-symbols-outlined text-primary text-4xl fill-icon">bolt</span>
<span class="material-symbols-outlined text-primary text-4xl fill-icon -ml-4">bolt</span>
</div>
</div>
<h3 class="headline-font text-xl font-bold text-on-surface mb-2">Medium</h3>
<p class="text-on-surface-variant text-sm text-center mb-6">A balanced challenge for true knowledge seekers.</p>
<div class="mt-auto flex gap-1">
<span class="material-symbols-outlined text-primary text-lg fill-icon">star</span>
<span class="text-xs font-bold text-primary">150 XP Per Win</span>
</div>
</button>
<!-- Hard Card -->
<button class="group relative flex flex-col items-center p-8 rounded-lg bg-surface-container-low border-2 border-transparent hover:border-error/30 transition-all duration-300 overflow-hidden">
<div class="absolute top-0 right-0 p-4 opacity-0 group-hover:opacity-10 transition-opacity">
<span class="material-symbols-outlined text-8xl text-error">bolt</span>
</div>
<div class="w-16 h-16 rounded-full bg-error/10 flex items-center justify-center mb-6">
<div class="flex">
<span class="material-symbols-outlined text-error text-4xl fill-icon">bolt</span>
<span class="material-symbols-outlined text-error text-4xl fill-icon -ml-4">bolt</span>
<span class="material-symbols-outlined text-error text-4xl fill-icon -ml-4">bolt</span>
</div>
</div>
<h3 class="headline-font text-xl font-bold text-on-surface mb-2">Hard</h3>
<p class="text-on-surface-variant text-sm text-center mb-6">Only for the masterminds of the galaxy.</p>

<span class="material-symbols-outlined text-error text-lg fill-icon">star</span>
<span class="text-xs font-bold text-error">500 XP Per Win</span>
</div>
</button>
</div>

<div class="flex items-center gap-3">
<button class="w-8 h-8 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-bright transition-colors">

</button>
<span class="headline-font font-bold text-xl w-8 text-center">30</span>
<button class="w-8 h-8 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-bright transition-colors">
<span class="material-symbols-outlined text-sm">add</span>
</button>
</div>
</div>
</div>
</div>
